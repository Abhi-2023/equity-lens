server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — client-side routes (e.g. /watchlist, /reports/:id) are
    # not real files, so unmatched paths fall back to index.html and
    # react-router takes it from there.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
