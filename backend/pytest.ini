[pytest]
asyncio_mode = auto
; app.db creates one async engine (and asyncpg pool) at import time, bound to
; whichever event loop is running when it's first used. pytest-asyncio's
; default is a fresh loop per test function, which then reuses that
; already-bound pool on a *different* loop and blows up with "attached to a
; different loop" / "Event loop is closed". One loop for the whole session
; matches how the engine is actually used in the running app.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
